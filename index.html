<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事務事業評価 事業一覧ツール作成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Meiryo","Hiragino Sans",sans-serif;background:#f3f4f6;color:#1f2937;min-height:100vh}
#app{max-width:860px;margin:0 auto;padding:12px}
#app.wide{max-width:1500px}

.hd{background:#1e40af;color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:12px}
.hd h1{font-size:1.1rem;font-weight:700}
.hd .sub{font-size:.8rem;opacity:.85;margin-top:3px}

.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h2{font-size:1rem;font-weight:700;margin-bottom:10px;color:#111827}
.card h3{font-size:.88rem;font-weight:700;margin:10px 0 6px;color:#374151}
.card p{font-size:.85rem;line-height:1.7;color:#374151;margin-bottom:6px}
.note{font-size:.78rem;color:#6b7280;line-height:1.6}
.warn{font-size:.8rem;color:#b91c1c;line-height:1.6}

.btn{display:inline-block;padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:.9rem;font-weight:600;transition:opacity .15s;text-align:center;text-decoration:none}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:#1e40af;color:#fff}
.btn-k{background:#22c55e;color:#fff}
.btn-h{background:#ef4444;color:#fff}
.btn-f{background:#f59e0b;color:#fff}
.btn-o{background:#fff;border:1px solid #d1d5db;color:#374151}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-full{width:100%;margin-bottom:8px}
.bbtns{display:flex;gap:8px;flex-wrap:wrap}

label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:4px}
select,input[type=text],input[type=url],textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:.88rem;font-family:inherit;margin-bottom:10px}
textarea{resize:vertical}
.field{margin-bottom:4px}
.preview-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px;font-size:.8rem;color:#1e3a8a;margin:10px 0;line-height:1.7}
.preview-box b{word-break:break-all}
.warn-box{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:.8rem;color:#991b1b;margin:10px 0;line-height:1.7}
.guide-steps{font-size:.84rem;line-height:1.8;color:#374151;margin:8px 0 14px 18px}
.guide-steps li{margin-bottom:8px}
.guide-steps code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:.78rem}

/* ファイル一覧 */
.file-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid #e5e7eb;border-radius:6px;padding:8px;margin-bottom:6px}
.file-row.active{border-color:#1e40af;background:#eff6ff}
.file-row .fname{flex:1;min-width:160px;font-size:.82rem;font-weight:600;word-break:break-all}
.file-row .fname small{font-weight:400;color:#6b7280}
.file-row .url-line{flex-basis:100%;display:flex;gap:6px;align-items:center;margin-top:4px}
.file-row .url-line input{flex:1;margin:0}
.order-btns{display:inline-flex;gap:2px;flex-shrink:0}
.order-btns .btn{padding:3px 7px}
.bulk-url{margin-top:10px}
.bulk-url summary{cursor:pointer;font-size:.82rem;color:#1e40af;font-weight:600}
.bulk-url textarea{margin-top:6px}


/* 投票データの送信先 */
label.radio{display:flex;gap:6px;align-items:center;font-size:.86rem;font-weight:400;margin:8px 0 2px;cursor:pointer}
.indent{margin-left:22px}
.dest-steps{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin:8px 0 0 22px;background:#fafafa}
.dest-steps .guide-steps{margin-left:16px}
.dest-steps input[type=url]{margin:6px 0}

/* 開始ページを探す：補助の方法 */
.alt-box{border-top:1px dashed #e5e7eb;margin-top:12px;padding-top:10px}
.method{border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin:8px 0}
.method-title{font-size:.88rem;font-weight:700;color:#111827;margin-bottom:4px}

/* 画面内メッセージ・処理中表示 */
.msg{border-radius:6px;padding:10px 12px;font-size:.82rem;line-height:1.7;margin:10px 0;word-break:break-word}
.msg-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.msg-info{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.msg-error{background:#fef2f2;border:2px solid #f87171;color:#991b1b;font-weight:600}
.btn-busy{display:inline-flex;align-items:center;justify-content:center;gap:8px;opacity:1 !important;cursor:progress !important}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* 一覧の下の案内 */
.next-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-top:12px}
.next-box h3{margin-top:0}
.next-item{border-bottom:1px solid #e5e7eb;padding:8px 0}
.next-item:last-of-type{border-bottom:none}
.next-q{font-size:.85rem;font-weight:700;color:#111827;margin-bottom:4px}
.dup-box{border:1px solid #fecaca;background:#fffafa;border-radius:8px;padding:12px;margin:8px 0}
.dup-hd{font-size:.85rem;font-weight:700;color:#991b1b;margin-bottom:4px}
.dup-list{font-size:.82rem;line-height:1.8;margin:6px 0 10px 18px}

/* 事業一覧 */
.proj-tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.proj-tbl th{text-align:left;font-weight:600;color:#6b7280;font-size:.7rem;padding:5px 6px;border-bottom:1px solid #e5e7eb;position:sticky;top:50px;background:#fff;z-index:1}
.proj-tbl td{padding:5px 6px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.proj-tbl input[type=text]{margin:0;padding:4px 6px;font-size:.78rem}
.proj-tbl td.c-no{color:#6b7280;width:34px}
.proj-tbl td.c-file{color:#6b7280;width:36px}
.proj-tbl td.c-page{width:34px;text-align:center}
.proj-tbl tr.dup td{background:#fef2f2}
.proj-tbl tr.cur td,.list-box .proj-tbl tbody tr.cur:hover td{background:#dbeafe}
.proj-tbl tr.flash td{animation:flash 1.6s}
@keyframes flash{from{background:#fde68a}}
.note-list{font-size:.78rem;color:#6b7280;line-height:1.6;margin:0 0 8px 18px}

/* 上部の帯（常に表示） */
.stepnav{position:sticky;top:0;z-index:30;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#1e3a8a;padding:6px 8px;border-radius:0 0 8px 8px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stepnav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.stepnav button:hover{background:rgba(255,255,255,.25)}
.stepnav button.done{background:rgba(34,197,94,.28);border-color:rgba(134,239,172,.7)}
.stepnav button.cur{background:#fff;color:#1e3a8a;border-color:#fff}
.goal-seg{display:inline}
.goal-num{display:inline-block;background:rgba(255,255,255,.22);border-radius:8px;padding:0 6px;margin:0 3px 0 2px;font-weight:700;font-size:.74rem}
.done-card h2{color:#166534}
.done-tbl{border-collapse:collapse;font-size:.85rem;margin-bottom:10px;width:100%}
.done-tbl th{text-align:left;font-weight:600;color:#6b7280;padding:5px 12px 5px 0;white-space:nowrap;vertical-align:top;width:1%}
.done-tbl td{padding:5px 0;word-break:break-all}
.done-btns{display:flex;gap:8px;flex-wrap:wrap}
.purpose{background:#eef2ff;border-left:4px solid #1e40af;border-radius:4px;padding:7px 10px;font-size:.82rem;color:#1e3a8a;line-height:1.6;margin:-2px 0 12px}
.nav-busy{display:inline-flex;align-items:center;gap:6px;color:#fde68a;font-size:.8rem;margin-left:auto}
.card,.msg,#dups-anchor,#side{scroll-margin-top:58px}

/* 2列レイアウト：左＝作業欄、右＝確認欄（固定） */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.side{position:sticky;top:54px}
.side-wrap{display:grid;gap:8px;height:calc(100vh - 66px)}
.side-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-list-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid #e5e7eb;font-size:.82rem}
.ratio-btns{display:inline-flex;margin-left:auto;border:1px solid #d1d5db;border-radius:6px;overflow:hidden}
.ratio-btns button{border:none;background:#fff;padding:3px 8px;font-size:.72rem;cursor:pointer;font-family:inherit;color:#374151}
.ratio-btns button+button{border-left:1px solid #d1d5db}
.ratio-btns button.active{background:#1e40af;color:#fff}
.list-box{flex:1;overflow:auto;min-height:0}
.list-box .proj-tbl th{top:0}
.list-box .proj-tbl tbody tr{cursor:pointer}
.list-box .proj-tbl tbody tr:hover td{background:#f1f5f9}
.list-box .proj-tbl td.c-del{width:1%;white-space:nowrap}
.list-box .proj-tbl td.c-sub{width:30%}
.list-box .proj-tbl td.c-del .btn{padding:4px 8px;white-space:nowrap}
.proj-tbl th{white-space:nowrap}
.side-hd{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #e5e7eb}
.side-hd select{margin:0;flex:1;min-width:0}
.side-fname{flex:1;min-width:0;font-size:.8rem;font-weight:600;word-break:break-all}
.side-tabs{display:flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden;flex-shrink:0}
.side-tabs button{border:none;background:#fff;padding:5px 14px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
.side-tabs button.active{background:#1e40af;color:#fff}
.side-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #e5e7eb;font-size:.8rem}
.side-tools input{width:56px;margin:0;padding:4px;text-align:center}
.zoom{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.side-body{flex:1;overflow:auto;background:#f3f4f6;padding:8px;text-align:center}
.side-body canvas{box-shadow:0 1px 4px rgba(0,0,0,.2);background:#fff}
.side-text{text-align:left;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:.8rem;line-height:1.6;background:#fff;padding:10px;border-radius:6px;margin:0}
.side-foot{padding:8px 10px;border-top:1px solid #e5e7eb;font-size:.8rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side-in{background:#dbeafe;color:#1e40af;border-radius:8px;padding:1px 8px;font-size:.72rem;font-weight:700}
.side-out{background:#f3f4f6;color:#6b7280;border-radius:8px;padding:1px 8px;font-size:.72rem;font-weight:700}
.side-empty{padding:24px;color:#6b7280;font-size:.85rem}
@media (max-width:960px){
  .layout{display:flex;flex-direction:column}
  .side{position:static;order:-1;width:100%}
  .side-wrap{display:flex;flex-direction:column;height:auto}
  .side-body{max-height:50vh}
  .list-box{max-height:50vh}
}
.tag-new{display:inline-block;font-size:.66rem;background:#dbeafe;color:#1e40af;border-radius:8px;padding:0 5px;margin-left:2px}

.pdf-footer{font-size:.72rem;color:#9ca3af;line-height:1.7;padding:10px 4px;margin-top:4px}
.pdf-footer a{color:#6b7280}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;text-align:center;color:#6b7280">読み込み中...</p></div>

<!--
  評価画面（書き出すHTML）のテンプレート。
  type="text/plain" なのでブラウザは実行しない。書き出し時に textContent を取り出し、
  ・__TITLE__ をタイトルに
  ・/*DATA_BEGIN*/null/*DATA_END*/ を事業一覧のJSONに

  置き換えてから保存する（このscript要素の中に生の </script> を書くと、ここで要素が終わってしまうため）。

<script type="text/plain" id="eval-template"><!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>__TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Meiryo","Hiragino Sans",sans-serif;background:#f3f4f6;color:#1f2937}
/* 画面全体：上（見出し・操作）＋中（スクロールする枠）＋下（送信の帯） */
.screen{max-width:860px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:8px 8px 0}
.top{flex-shrink:0}
.scroll{flex:1;min-height:0;overflow-y:auto;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hd{background:#1e40af;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:8px}
.hd h1{font-size:1rem;font-weight:700}
.hd .sub{font-size:.76rem;opacity:.85;margin-top:2px}
.hd .unofficial{font-size:.68rem;opacity:.8;margin-top:4px;border-top:1px solid rgba(255,255,255,.3);padding-top:4px}
.panel{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note{font-size:.76rem;color:#6b7280;line-height:1.6}
.btn{display:inline-block;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600;text-align:center;text-decoration:none;font-family:inherit}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:#1e40af;color:#fff}
.btn-k{background:#16a34a;color:#fff}
.btn-o{background:#fff;border:1px solid #d1d5db;color:#374151}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn-full{width:100%}

/* 自分の集計・絞り込み */
.mine{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;margin-bottom:8px}
.mine b{font-size:.95rem}
.mine .pend{color:#b45309;font-weight:700}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:5px 11px;border:1px solid #d1d5db;border-radius:16px;background:#fff;color:#374151;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
.chip.active{background:#1e40af;color:#fff;border-color:#1e40af}
.ctrls select,.ctrls input{padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:.82rem;font-family:inherit;background:#fff}
.ctrls input{flex:1;min-width:140px}
.mine-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mine-row .mine{margin-bottom:0;flex:1}
.dl-btn{border:1px solid #d1d5db;background:#fff;border-radius:16px;padding:4px 11px;font-size:.76rem;cursor:pointer;font-family:inherit;color:#374151;white-space:nowrap}
.dl-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:8px}
.dl-box.hidden{display:none}

/* 一覧の行 */
.row{padding:9px 12px;border-bottom:1px solid #f1f5f9}
.row.has-pend{background:#fffbeb}
.row-name{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.row-name .no{font-size:.72rem;color:#9ca3af;flex-shrink:0;min-width:26px}
.row-name .nm{font-size:.9rem;font-weight:600;color:#111827;line-height:1.4}
.row-name:hover .nm{color:#1e40af;text-decoration:underline}
.subtxt{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:400;color:#6b7280}
.detail-sub{font-size:.8rem;font-weight:400;color:#6b7280;margin-top:2px}
.row-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 0 34px}
.sheet{font-size:.76rem;color:#1e40af;text-decoration:none;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:3px 9px;white-space:nowrap}
.vote{display:inline-flex;align-items:center;gap:5px;border:1px solid #d1d5db;background:#fff;border-radius:16px;padding:4px 11px;font-size:.82rem;cursor:pointer;font-family:inherit;color:#374151;white-space:nowrap}
.vote .cnt{font-weight:700;min-width:1em}
.vote.good.sel{background:#16a34a;border-color:#16a34a;color:#fff}
.vote.bad.sel{background:#dc2626;border-color:#dc2626;color:#fff}
.cmt{font-size:.8rem;color:#4b5563;cursor:pointer;white-space:nowrap;padding:3px 4px}
.pend-tag{font-size:.68rem;color:#b45309;background:#fef3c7;border-radius:8px;padding:1px 7px;font-weight:700}
.empty{padding:20px;text-align:center;color:#9ca3af;font-size:.85rem}

/* 詳細 */
.detail{padding:14px}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.detail-nav .pos{font-size:.8rem;color:#6b7280}
.detail-name{font-size:1.05rem;font-weight:700;color:#111827;line-height:1.5;margin-bottom:10px}
.sheet-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-bottom:12px}
.big-votes{display:flex;gap:10px;margin:6px 0 4px}
.big-votes .vote{flex:1;justify-content:center;padding:12px;font-size:1rem;border-radius:10px;border-width:2px}
.sec{font-size:.85rem;font-weight:700;color:#374151;margin:16px 0 6px}
.comment-item{background:#f8f9fb;border:1px solid #eef0f2;border-radius:6px;padding:8px 10px;margin-bottom:6px}
.comment-text{font-size:.84rem;color:#374151;white-space:pre-wrap;word-break:break-word;margin-bottom:4px;line-height:1.6}
.comment-report-btn{background:none;border:none;color:#9ca3af;font-size:.7rem;cursor:pointer;padding:0;font-family:inherit}
.comment-report-btn:hover{color:#dc2626}
textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:.88rem;font-family:inherit;resize:vertical}

/* 下部の送信の帯（常に表示） */
.sendbar{flex-shrink:0;background:#fff;border-top:2px solid #e5e7eb;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -2px 6px rgba(0,0,0,.06)}
.sendbar.has-pend{border-top-color:#f59e0b;background:#fffbeb}
.sendbar .msg{flex:1;min-width:180px;font-size:.8rem;line-height:1.5;color:#374151}
.sendbar.has-pend .msg b{color:#b45309}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;max-width:min(560px,92vw);background:#1f2937;color:#fff;border-radius:8px;padding:10px 14px;font-size:.82rem;line-height:1.6;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:50;white-space:pre-wrap}
.toast.err{background:#991b1b}
.toast button{background:none;border:none;color:#fff;opacity:.8;margin-left:8px;cursor:pointer;font-size:.8rem}
.foot{font-size:.7rem;color:#9ca3af;line-height:1.7;padding:12px}
.foot a{color:#6b7280}
@media (max-width:480px){.row-acts{margin-left:0}.hd h1{font-size:.92rem}}
</style>
</head>

<script>
// このファイルは「事務事業評価 事業一覧ツール作成」で書き出したものです。
// DATA を手で書き換えると、投票の集計がずれるおそれがあります。修正は作成ツールの「前回作ったHTMLから作り直す」から行ってください。
const DATA = /*DATA_BEGIN*/null/*DATA_END*/;

const GAS_URL = DATA.gas_url;
const TOOL_ID = DATA.tool_id;
const COMMENT_MAX_LENGTH = 500;
const RATE_CHUNK = 150;
const COMMENT_PII_PATTERNS = [
  { test: /0\d{1,4}-\d{1,4}-\d{3,4}/, label: '電話番号らしき数字列' },
  { test: /[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/, label: 'メールアドレスらしき文字列' },
  { test: /https?:\/\/\S+/, label: 'URL' },
  { test: /(私|僕|自分)の名前は|本名は/, label: '氏名を明示する表現' }
];
function findCommentPii(text) {
  for (const p of COMMENT_PII_PATTERNS) { if (p.test.test(text)) return p.label; }
  return null;
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── この端末に保存するもの ─────────────────────────
const LS = 'gyosei_list_' + TOOL_ID + '_';
function lsGet(k, def) { try { const v = JSON.parse(localStorage.getItem(LS + k)); return v == null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
function randomId(len) {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const buf = new Uint8Array(len);
  crypto.getRandomValues(buf);
  return Array.from(buf, b => chars[b % chars.length]).join('');
}
// 端末ごとのランダムな識別番号。同じ端末から同じ事業に送り直すと、集計では最新の評価だけが数えられる
let VOTER_ID = lsGet('voter', '');
if (!/^[0-9a-z]{8,40}$/.test(VOTER_ID)) { VOTER_ID = randomId(16); lsSet('voter', VOTER_ID); }

let ratings = lsGet('ratings', {});   // 事業No -> 'good' | 'bad'（自分の現在の評価）
let sent = lsGet('sent', {});         // 事業No -> 'good' | 'bad' | 'none'（最後に送信した評価）
let drafts = lsGet('drafts', {});     // 事業No -> 未送信のコメント
let hintShown = lsGet('hint', false);

const PROJECTS = DATA.projects;       // 表示順（ファイル順→ページ順）。no は投票の識別番号
const BY_NO = {};
PROJECTS.forEach((p, i) => { BY_NO[p.no] = p; p.idx = i; });

let agg = null;        // 事業No -> {good, bad}（みんなの集計。送信済みの分）
let comments = null;   // 事業No -> [{id, comment}]
let commentsFailed = false;  // コメントの取得に失敗したか（件数は「-」のまま表示する）
let screen = 'list', curNo = null;
let filter = '', sortKey = 'page', searchText = '';
let listScroll = 0, sending = false;

function projLabel(p) { return p.name ? p.name : `事業 No.${p.no}`; }
function sheetUrl(p) { const f = DATA.files[p.f]; return f && f.url ? f.url + '#page=' + p.page : ''; }
function pageLabel(p) { const f = DATA.files[p.f]; return (DATA.files.length > 1 && f ? f.name + ' ' : '') + 'p.' + p.page; }
function aggOf(no) { return (agg && agg[no]) || { good: 0, bad: 0 }; }
function commentCount(no) { return comments && comments[no] ? comments[no].length : 0; }

// 未送信：現在の評価と最後に送った評価が違う事業、または書きかけのコメントがある事業
function ratingPending(no) { return (ratings[no] || 'none') !== (sent[no] || 'none'); }
function pendingRatingNos() { return PROJECTS.filter(p => ratingPending(p.no)).map(p => p.no); }
function pendingCommentNos() { return PROJECTS.filter(p => drafts[p.no] && drafts[p.no].trim()).map(p => p.no); }

// ========================================================================
// 画面
// ========================================================================
// 自治体の公式なツールと誤解されないよう、民間が作成した非公式のものであることを見出しとフッターに必ず表示する
function unofficialText() {
  const m = DATA.muni_name || '自治体';
  return `この評価ツールは、${m}が公表している評価シートをもとに、民間で作成したものです。${m}の公式なものではありません。`;
}
function headerHtml(sub) {
  return `<div class="hd"><h1>${esc(DATA.title)}</h1><div class="sub">${esc(sub)}</div><div class="unofficial">${esc(unofficialText())}</div></div>`;
}
function footHtml() {
  return `<div class="foot">
    ${DATA.source_url ? `<p><strong>出典：</strong><a href="${esc(DATA.source_url)}" target="_blank" rel="noopener" style="overflow-wrap:anywhere">${esc(DATA.source_url)}</a></p>` : ''}
    <p>評価の判断材料は、自治体が公表している評価シートです。本ツールは事業の一覧と投票の機能だけを提供しています。</p>
    <p>評価とコメントは、送信するまでこの端末にだけ保存されます。送信した評価は、あとから変更できます（送信したコメントは修正・削除できません）。</p>
    <p><strong>${esc(unofficialText())}</strong></p>
    <p>この評価ツールは、<a href="https://onuma-spec.github.io/jimujigyou-hyoka-list/" target="_blank" rel="noopener">事務事業評価 事業一覧ツール作成</a>で作成しました。どなたでも、ほかの自治体の評価ツールを作れます。</p>
    <p>本ツールは、Claude（AI）を用いて作成しています。　ツールのライセンス：MIT</p>

function sendbarHtml() {
  const r = pendingRatingNos().length, c = pendingCommentNos().length;
  const n = r + c;
  if (sending) return `<div class="sendbar has-pend" id="sendbar"><div class="msg">送信しています…</div><button class="btn btn-k" disabled>送信中…</button></div>`;
  return `<div class="sendbar ${n ? 'has-pend' : ''}" id="sendbar">
    <div class="msg">${n
      ? `⚠ <b>未送信が${n}件</b>あります（評価${r}件・コメント${c}件）。<br>途中でも送信できます。送信した評価は、あとから変更できます。`
      : (Object.keys(ratings).length ? '✓ 評価はすべて送信済みです。' : '👍／👎 を押して評価し、最後にここから送信してください。')}</div>
    <button class="btn btn-k" ${n ? '' : 'disabled'} onclick="submitAll()">📤 まとめて送信する</button>
  </div>`;
}
function refreshSendbar() {
  const el = document.getElementById('sendbar');
  if (el) el.outerHTML = sendbarHtml();
}

// ── 一覧（まとめを兼ねる） ───────────────────────────
function renderList() {

  document.getElementById('app').innerHTML = `<div class="screen">
    <div class="top">
      ${headerHtml(`全${PROJECTS.length}事業　評価シートを確認して、👍（良い）か 👎（悪い）を押してください`)}
      <div class="panel">

          <select onchange="sortKey=this.value; renderRows(true)">

              `<option value="${v}" ${sortKey === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
          <input type="search" placeholder="事業名・補足で絞り込み" value="${esc(searchText)}" oninput="searchText=this.value; renderRows(true)">
        </div>
      </div>
    </div>
    <div class="scroll" id="list-scroll"><div id="rows"></div>${footHtml()}</div>
    ${sendbarHtml()}
  </div>`;
  renderRows(false);
  document.getElementById('list-scroll').scrollTop = listScroll;
}

function mineHtml() {
  let good = 0, bad = 0;
  PROJECTS.forEach(p => { if (ratings[p.no] === 'good') good++; else if (ratings[p.no] === 'bad') bad++; });
  const pend = pendingRatingNos().length + pendingCommentNos().length;
  return `<span>自分の評価：</span><span>👍 <b>${good}</b></span><span>👎 <b>${bad}</b></span><span>未評価 <b>${PROJECTS.length - good - bad}</b></span>${pend ? `<span class="pend">未送信 ${pend}件</span>` : ''}`;
}

function setFilter(v) {
  filter = v;
  document.querySelectorAll('.chip').forEach((b, i) => b.classList.toggle('active', ['', 'good', 'bad', 'none', 'comment'][i] === v));
  renderRows(true);
}

function visibleProjects() {
  const q = searchText.trim();
  let list = PROJECTS.filter(p => {
    if (q && !((p.name || '') + ' ' + (p.sub || '')).includes(q)) return false;
    if (filter === 'good' || filter === 'bad') return ratings[p.no] === filter;
    if (filter === 'none') return !ratings[p.no];
    if (filter === 'comment') return commentCount(p.no) > 0;
    return true;
  });
  if (sortKey === 'good') list = list.slice().sort((a, b) => aggOf(b.no).good - aggOf(a.no).good || a.idx - b.idx);
  else if (sortKey === 'bad') list = list.slice().sort((a, b) => aggOf(b.no).bad - aggOf(a.no).bad || a.idx - b.idx);
  else if (sortKey === 'comment') list = list.slice().sort((a, b) => commentCount(b.no) - commentCount(a.no) || a.idx - b.idx);
  return list;
}

function rowHtml(p) {
  const a = aggOf(p.no), mine = ratings[p.no] || '';
  const url = sheetUrl(p);
  const pend = ratingPending(p.no) || !!(drafts[p.no] && drafts[p.no].trim());
  return `<div class="row ${pend ? 'has-pend' : ''}" id="row-${p.no}">
    <div class="row-name" onclick="openProject(${p.no})"><span class="no">${p.no}</span><span class="nm">${esc(projLabel(p))}${p.sub ? `<span class="subtxt">${esc(p.sub)}</span>` : ''}</span></div>
    <div class="row-acts">
      ${url ? `<a class="sheet" href="${esc(url)}" target="_blank" rel="noopener">📄 評価シート ${esc(pageLabel(p))}</a>` : `<span class="sheet">📄 ${esc(pageLabel(p))}</span>`}
      <button class="vote good ${mine === 'good' ? 'sel' : ''}" onclick="rate(${p.no}, 'good')" title="良い">👍 <span class="cnt">${agg ? a.good : '-'}</span></button>
      <button class="vote bad ${mine === 'bad' ? 'sel' : ''}" onclick="rate(${p.no}, 'bad')" title="悪い">👎 <span class="cnt">${agg ? a.bad : '-'}</span></button>
      <span class="cmt" onclick="openProject(${p.no})">💬 ${comments ? commentCount(p.no) : '-'}</span>
      ${pend ? '<span class="pend-tag">未送信</span>' : ''}
    </div>
  </div>`;
}

function renderRows(resetScroll) {
  const el = document.getElementById('rows');
  if (!el) return;
  const list = visibleProjects();
  el.innerHTML = list.length ? list.map(rowHtml).join('') : '<div class="empty">該当する事業がありません。</div>';
  if (resetScroll) document.getElementById('list-scroll').scrollTop = 0;
}

// 1行だけ・上部の集計・送信の帯だけを書き換える（一覧のスクロール位置を保つため）
function refreshAfterChange(no) {
  const row = document.getElementById('row-' + no);
  if (row) row.outerHTML = rowHtml(BY_NO[no]);
  const mine = document.getElementById('mine');
  if (mine) mine.innerHTML = mineHtml();
  if (screen === 'detail') refreshDetailVotes();
  refreshSendbar();
}

// ── 評価 ─────────────────────────────────────────
function rate(no, r) {
  if (ratings[no] === r) delete ratings[no]; else ratings[no] = r;
  lsSet('ratings', ratings);
  refreshAfterChange(no);
  if (!hintShown) {
    hintShown = true;
    lsSet('hint', true);
    toast('評価はこの端末に保存されました。\n最後に画面下の「📤 まとめて送信する」を押してください（途中でも送信でき、送信した評価はあとから変更できます）。', false, 9000);
  }
}

  if (box) listScroll = box.scrollTop;
  curNo = no;

}

             <p class="note" style="margin-top:6px">スマートフォンなどでは指定のページではなく1ページ目が開くことがあります。その場合は p.${p.page} まで移動してください。</p>`
          : `<p class="note">評価シートへのリンクは設定されていません。${DATA.source_url ? '出典ページから評価シートを開き、' : ''}${esc(pageLabel(p))} をご覧ください。</p>`}
      </div>

      <div class="sec">この事業の評価</div>

      <div class="sec">自分のコメント（任意）</div>
      <textarea rows="4" maxlength="${COMMENT_MAX_LENGTH}" placeholder="評価の理由や、良い点・悪い点などを自由に書いてください" oninput="saveDraft(${p.no}, this.value)">${esc(drafts[p.no] || '')}</textarea>
      <p class="note">コメントは、画面下の「まとめて送信する」で評価と一緒に送信されます。送信したコメントは修正・削除できません。電話番号・メールアドレス・URL・氏名は書かないでください。</p>
      ${next ? `<button class="btn btn-o btn-full" style="margin-top:14px" onclick="openProject(${next.no})">次の事業へ →</button>` : ''}
    </div>${footHtml()}</div>
    ${sendbarHtml()}

function bigVotesHtml(p) {
  const a = aggOf(p.no), mine = ratings[p.no] || '';
  return `<button class="vote good ${mine === 'good' ? 'sel' : ''}" onclick="rate(${p.no}, 'good')">👍 良い <span class="cnt">${agg ? a.good : '-'}</span></button>
    <button class="vote bad ${mine === 'bad' ? 'sel' : ''}" onclick="rate(${p.no}, 'bad')">👎 悪い <span class="cnt">${agg ? a.bad : '-'}</span></button>`;
}
function refreshDetailVotes() {
  const el = document.getElementById('big-votes');
  if (el) el.innerHTML = bigVotesHtml(BY_NO[curNo]);
}
function saveDraft(no, text) {
  const had = !!(drafts[no] && drafts[no].trim());
  if (text.trim()) drafts[no] = text; else delete drafts[no];
  lsSet('drafts', drafts);
  if (had !== !!text.trim()) refreshSendbar();
}

function commentListHtml(no) {
  if (!comments) return commentsFailed
    ? '<p class="note">コメントを読み込めませんでした。時間をおいてページを開き直してください。</p>'
    : '<p class="note">読み込み中...</p>';
  const list = comments[no] || [];
  if (!list.length) return '<p class="note">まだコメントがありません。</p>';
  return list.map(c => `<div class="comment-item">
      <p class="comment-text">${esc(c.comment)}</p>
      <button class="comment-report-btn" onclick="reportComment(${Number(c.id)})">🚩 不適切として報告する</button>
    </div>`).join('');
}

// ========================================================================
// 通信
// ========================================================================
async function api(params) {
  const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  const res = await fetch(GAS_URL + '?' + qs);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '送信に失敗しました');
  return json;
}

async function loadAgg() {
  try { agg = (await api({ action: 'agg', tool_id: TOOL_ID })).agg || {}; }
  catch (e) { /* 取得に失敗しても画面は壊さない */ }
  repaintCounts();
}
async function loadComments() {
  try {
    const json = await api({ action: 'comment_list', tool_id: TOOL_ID });
    const map = {};
    (json.comments || []).forEach(c => { (map[c.event_no] = map[c.event_no] || []).push(c); });
    comments = map;
    commentsFailed = false;
  } catch (e) { commentsFailed = true; /* 前回取得した分があればそのまま。なければ件数は「-」のまま */ }
  repaintCounts();
}
// 件数が届いたら、今の画面の件数表示を更新する（スクロール位置は保つ）
function repaintCounts() {
  if (screen === 'list') {
    const box = document.getElementById('list-scroll');
    const top = box ? box.scrollTop : 0;
    renderRows(false);
    if (box) box.scrollTop = top;
  } else if (screen === 'detail') {
    // 入力中のコメント欄を消さないよう、件数とコメント一覧の部分だけを書き換える
    refreshDetailVotes();
    const list = document.getElementById('comment-list');
    if (list) list.innerHTML = commentListHtml(curNo);
    const cnt = document.getElementById('cmt-count');
    if (cnt) cnt.textContent = comments ? commentCount(curNo) : '-';
  }
}

async function reportComment(id) {
  if (!confirm('このコメントを不適切として報告しますか？')) return;
  try { await api({ action: 'comment_report', tool_id: TOOL_ID, comment_id: id }); toast('報告しました。'); }
  catch (err) { toast('送信できませんでした：' + err.message, true); }
}

async function submitAll() {
  if (sending) return;
  const rNos = pendingRatingNos();
  const cNos = pendingCommentNos();
  const skipped = [];
  const okComments = [];
  cNos.forEach(no => {
    const text = drafts[no].trim();
    const pii = findCommentPii(text);
    if (pii) skipped.push(`No.${no}：${pii}が含まれている可能性があるため送信しませんでした`);
    else if (text.length > COMMENT_MAX_LENGTH) skipped.push(`No.${no}：${COMMENT_MAX_LENGTH}文字を超えています`);
    else okComments.push([no, text]);
  });
  if (!rNos.length && !okComments.length) { toast('送信できるものがありません。\n' + skipped.join('\n'), true, 9000); return; }

  sending = true;
  refreshSendbar();
  let sentR = 0, sentC = 0, failed = '';
  try {
    for (let i = 0; i < rNos.length; i += RATE_CHUNK) {
      const chunk = rNos.slice(i, i + RATE_CHUNK).map(no => [no, ratings[no] || 'none']);
      await api({ action: 'rate', tool_id: TOOL_ID, voter_id: VOTER_ID, rows: JSON.stringify(chunk) });
      chunk.forEach(([no, r]) => { sent[no] = r; });
      lsSet('sent', sent);
      sentR += chunk.length;
    }
    for (const [no, text] of okComments) {
      try {
        await api({ action: 'comment', tool_id: TOOL_ID, event_no: no, comment: text });
        delete drafts[no];
        lsSet('drafts', drafts);
        sentC++;
      } catch (err) {
        skipped.push(`No.${no}：${err.message === 'pii detected' ? '個人情報らしき文字が含まれているため送信できませんでした' : '送信エラー（' + err.message + '）'}`);
      }
    }
  } catch (err) {
    failed = err.message;
  }
  sending = false;

  let msg = failed
    ? `送信中にエラーが発生しました（${failed}）。\n送信できたのは評価${sentR}件・コメント${sentC}件です。時間をおいて、もう一度「まとめて送信する」を押してください。`
    : `送信しました（評価${sentR}件・コメント${sentC}件）。ありがとうございました。`;
  if (skipped.length) msg += '\n\n送信しなかったコメント：\n' + skipped.join('\n');
  toast(msg, !!failed || skipped.length > 0, 9000);
  if (screen === 'detail') renderDetail(); else renderList();
  loadAgg();
  loadComments();
}

// ── 通知（画面下部に一時表示） ───────────────────────
// ── 結果のダウンロード（みんなの集計・コメント一覧のCSV） ─────────────
// 共有の送信先を使う場合、評価ツールを作った人はスプレッドシートを見られないため、結果を持ち出す手段としてここで提供する
let showDl = false;
function toggleDl() {
  showDl = !showDl;
  const el = document.getElementById('dl-box');
  if (el) el.classList.toggle('hidden', !showDl);
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtTime(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function downloadCsv(filename, rows) {
  // Excelで文字化けしないよう、先頭にBOMを付けたUTF-8で書き出す
  const text = String.fromCharCode(0xFEFF) + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
async function downloadResults(kind) {
  const btns = document.querySelectorAll('#dl-box button');
  btns.forEach(b => { b.disabled = true; });
  try {
    // 最新の集計とコメントを取り直してから書き出す
    const [ja, jc] = await Promise.all([
      api({ action: 'agg', tool_id: TOOL_ID }),
      api({ action: 'comment_list', tool_id: TOOL_ID })
    ]);
    agg = ja.agg || {};
    const map = {};
    (jc.comments || []).forEach(c => { (map[c.event_no] = map[c.event_no] || []).push(c); });
    comments = map;
    repaintCounts();
    const now = new Date();
    const day = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}`;
    const base = DATA.title.replace(/\s+/g, '_');
    if (kind === 'agg') {
      const rows = [['No', '事業名', '補足', '評価シートのファイル', 'ページ', '評価シートのURL', '良い（👍）', '悪い（👎）', 'コメント数']];
      PROJECTS.forEach(p => {
        const f = DATA.files[p.f] || {};
        const a = aggOf(p.no);
        rows.push([p.no, p.name || '', p.sub || '', f.name || '', p.page, sheetUrl(p), a.good, a.bad, commentCount(p.no)]);
      });
      downloadCsv(`${base}_集計_${day}.csv`, rows);
      toast(`集計（${PROJECTS.length}事業）をダウンロードしました（${fmtTime(now)}時点）。`);
    } else {
      const rows = [['No', '事業名', '補足', 'コメント', '投稿日時']];
      PROJECTS.forEach(p => (comments[p.no] || []).forEach(c => {
        const d = new Date(c.submitted_at);
        rows.push([p.no, p.name || '', p.sub || '', c.comment, isNaN(d) ? (c.submitted_at || '') : fmtTime(d)]);
      }));
      if (rows.length === 1) { toast('コメントはまだありません。'); return; }
      downloadCsv(`${base}_コメント一覧_${day}.csv`, rows);
      toast(`コメント一覧（${rows.length - 1}件）をダウンロードしました（${fmtTime(now)}時点）。`);
    }
  } catch (err) {
    toast('結果を取得できませんでした：' + err.message, true);
  } finally {
    btns.forEach(b => { b.disabled = false; });
  }
}

<!-- 自分のスプレッドシート用のGASコード（④の「コードをコピー」で使う）。gas/Code.gs と同じ内容。
     Code.gs を修正したら、sync_gas_code.py を実行してここを更新すること -->
<script type="text/plain" id="gas-code">
/**
 * 事務事業評価 事業一覧ツール（評価画面）専用 GAS+Sheets バックエンド
 *
 * 既存の事務事業優先度評価ツール（v3・10自治体）のGASとは別物。
 * 評価は 👍good／👎bad の2択で、端末ごとのランダムな識別番号（voter_id）を使い、
 * 同じ端末から同じ事業に送り直した場合は「最新の評価だけ」を集計する（評価の変更・取り消しに対応）。
 *
 * 【シート】（setupSheets() を1回実行すると自動で作られる）
 *   ratings          ： id | tool_id | voter_id | event_no | rating | submitted_at
 *                       rating は good / bad / none（none＝評価の取り消し）。行は追記のみで、集計時に最新を採用する
 *   comments         ： id | tool_id | event_no | comment | submitted_at
 *   comment_reports  ： id | comment_id | tool_id | reported_at
 *
 * 【注意】書き込みもdoGetで行う。GAS Web Appは匿名アクセス時に302リダイレクトするため、
 * ブラウザのfetch()でPOSTするとGETへ変換されボディが失われる（既存GASと同じ理由）。
 */

var RATINGS_SHEET = 'ratings';
var COMMENTS_SHEET = 'comments';
var REPORTS_SHEET = 'comment_reports';
var RATING_VALUES = { good: true, bad: true, none: true };
var MAX_ROWS_PER_REQUEST = 200;
var REPORT_HIDE_THRESHOLD = 3; // 同一コメントへの通報がこの件数に達したら一覧から除外する
var COMMENT_MAX_LENGTH = 500;

// クライアント側と同じ4パターン。直接APIを呼ばれた場合に備えてサーバー側でもチェックする
var PII_PATTERNS = [
  /0\d{1,4}-\d{1,4}-\d{3,4}/,
  /[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}/,
  /https?:\/\/\S+/,
  /(私|僕|自分)の名前は|本名は/
];
function containsPii_(text) {
  for (var i = 0; i < PII_PATTERNS.length; i++) {
    if (PII_PATTERNS[i].test(text)) return true;
  }
  return false;
}

var HEADERS = {};
HEADERS[RATINGS_SHEET] = ['id', 'tool_id', 'voter_id', 'event_no', 'rating', 'submitted_at'];
HEADERS[COMMENTS_SHEET] = ['id', 'tool_id', 'event_no', 'comment', 'submitted_at'];
HEADERS[REPORTS_SHEET] = ['id', 'comment_id', 'tool_id', 'reported_at'];

// 初回に1回だけ手動で実行する（3枚のシートとヘッダー行を作る。すでにあれば何もしない）
function setupSheets() {
  Object.keys(HEADERS).forEach(function (name) { getSheet_(name); });
}

function getSheet_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  if (!sheet) {
    sheet = ss.insertSheet(name);
    sheet.getRange(1, 1, 1, HEADERS[name].length).setValues([HEADERS[name]]);
    sheet.setFrozenRows(1);
  }
  return sheet;
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function readRows_(name) {
  var values = getSheet_(name).getDataRange().getValues();
  return values.slice(1).filter(function (row) { return row[0] !== '' && row[0] !== null; });
}

function appendRows_(name, makeRows) {
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    var sheet = getSheet_(name);
    var lastRow = sheet.getLastRow(); // ヘッダー行を含む
    var nextId = Math.max(lastRow - 1, 0);
    var now = new Date().toISOString();
    var rows = makeRows(function () { return ++nextId; }, now);
    if (rows.length) sheet.getRange(lastRow + 1, 1, rows.length, rows[0].length).setValues(rows);
    return rows;
  } finally {
    lock.releaseLock();
  }
}

function validToolId_(s) { return typeof s === 'string' && /^[0-9a-z_]{5,60}$/.test(s); }
function validVoterId_(s) { return typeof s === 'string' && /^[0-9a-z]{8,40}$/.test(s); }

function doPost(e) {
  return jsonOut_({ ok: false, error: 'not supported: use GET' });
}

function doGet(e) {
  try {
    var p = e.parameter;
    var action = p.action;
    var toolId = p.tool_id;
    if (!validToolId_(toolId)) return jsonOut_({ ok: false, error: 'invalid tool_id' });

    // ── 評価の送信：rows = [[event_no, "good"|"bad"|"none"], ...] ──────────
    if (action === 'rate') {
      var voterId = p.voter_id;
      if (!validVoterId_(voterId)) return jsonOut_({ ok: false, error: 'invalid voter_id' });
      var pairs = JSON.parse(p.rows || '[]');
      if (!Array.isArray(pairs) || !pairs.length) return jsonOut_({ ok: false, error: 'no rows' });
      if (pairs.length > MAX_ROWS_PER_REQUEST) return jsonOut_({ ok: false, error: 'too many rows' });
      for (var i = 0; i < pairs.length; i++) {
        var no = Number(pairs[i][0]);
        if (!(no >= 1 && no === Math.floor(no)) || !RATING_VALUES[pairs[i][1]]) return jsonOut_({ ok: false, error: 'invalid row' });
      }
      var inserted = appendRows_(RATINGS_SHEET, function (nextId, now) {
        return pairs.map(function (pr) { return [nextId(), toolId, voterId, Number(pr[0]), pr[1], now]; });
      });
      return jsonOut_({ ok: true, inserted: inserted.length });
    }

    // ── 集計：端末×事業ごとに最新の評価を採用して good/bad を数える ──────────
    if (action === 'agg') {
      var latest = {}; // "voter|event_no" -> rating（行は追記順なので後勝ち）
      readRows_(RATINGS_SHEET).forEach(function (row) {
        if (String(row[1]) !== toolId) return;
        latest[row[2] + '|' + row[3]] = row[4];
      });
      var agg = {};
      Object.keys(latest).forEach(function (key) {
        var rating = latest[key];
        if (rating !== 'good' && rating !== 'bad') return;
        var no = key.split('|')[1];
        if (!agg[no]) agg[no] = { good: 0, bad: 0 };
        agg[no][rating]++;
      });
      return jsonOut_({ ok: true, agg: agg });
    }

    // ── コメント（追加のみ。修正・削除はできない） ─────────────────────
    if (action === 'comment') {
      var eventNo = Number(p.event_no);
      var comment = String(p.comment || '');
      if (!(eventNo >= 1)) return jsonOut_({ ok: false, error: 'missing event_no' });
      if (!comment.trim()) return jsonOut_({ ok: false, error: 'empty comment' });
      if (comment.length > COMMENT_MAX_LENGTH) return jsonOut_({ ok: false, error: 'comment too long' });
      if (containsPii_(comment)) return jsonOut_({ ok: false, error: 'pii detected' });
      var crow = appendRows_(COMMENTS_SHEET, function (nextId, now) {
        return [[nextId(), toolId, eventNo, comment, now]];
      });
      return jsonOut_({ ok: true, id: crow[0][0] });
    }

    if (action === 'comment_report') {
      var commentId = Number(p.comment_id);
      if (!(commentId >= 1)) return jsonOut_({ ok: false, error: 'missing comment_id' });
      appendRows_(REPORTS_SHEET, function (nextId, now) {
        return [[nextId(), commentId, toolId, now]];
      });
      return jsonOut_({ ok: true });
    }

    if (action === 'comment_list') {
      var reportCounts = {};
      readRows_(REPORTS_SHEET).forEach(function (row) {
        var cid = String(row[1]);
        reportCounts[cid] = (reportCounts[cid] || 0) + 1;
      });
      var comments = readRows_(COMMENTS_SHEET)
        .filter(function (row) { return String(row[1]) === toolId && (reportCounts[String(row[0])] || 0) < REPORT_HIDE_THRESHOLD; })
        .map(function (row) {
          return {
            id: row[0],
            event_no: String(row[2]),
            comment: row[3],
            submitted_at: row[4] instanceof Date ? row[4].toISOString() : row[4]
          };
        });
      comments.sort(function (a, b) { return String(a.submitted_at).localeCompare(String(b.submitted_at)); });
      return jsonOut_({ ok: true, comments: comments });
    }

    return jsonOut_({ ok: false, error: 'unknown action' });
  } catch (err) {
    return jsonOut_({ ok: false, error: String(err) });
  }
}
</script>

function renderSetup() {
  const app = document.getElementById('app');
  app.classList.toggle('wide', setup.step === 2);
  const head = `
    <div class="hd">
      <h1>🛠 事務事業評価 事業一覧ツール作成</h1>
      <div class="sub">${setup.step === 2 ? goalSentenceHtml() : GOAL_SEGMENTS.map(g => g.text).join('')}</div>
    </div>`;
  if (setup.step === 1) {
    app.innerHTML = head + step1Html() + footerHtml();
    return;
  }
  if (setup.step === 3) {
    app.innerHTML = head + doneHtml() + footerHtml();
    window.scrollTo(0, 0);
    return;
  }
  // 描き直しても、事業一覧と確認欄のスクロール位置を保つ
  const box = document.getElementById('list-box');
  const listTop = box ? box.scrollTop : 0;
  const body = document.getElementById('side-body');
  if (body) setup.sideScroll = { top: body.scrollTop, left: body.scrollLeft };
  // 左＝作業欄（ページ全体でスクロール）、右＝確認欄（上）と事業一覧（下）（固定表示）
  app.innerHTML = `${head}
    ${stepNavHtml()}
    <div class="layout">
      <div class="work">${step2Html()}${footerHtml()}</div>
      <aside class="side" id="side">
        <div class="side-wrap" style="grid-template-rows:${SIDE_RATIOS[setup.sideRatio].rows}">
          <div class="side-card" id="side-view">${sideViewHtml()}</div>
          <div class="side-card" id="side-list">${sideListHtml()}</div>
        </div>
      </aside>
    </div>`;
  const newBox = document.getElementById('list-box');
  if (newBox) newBox.scrollTop = setup.listToTop ? 0 : listTop;
  setup.listToTop = false;
  highlightCurrentRows();
  requestAnimationFrame(drawSide);
}

  setup.muniName = m ? m.name : '';
  renderSetup();
}
function setupSetReiwa(v) { setup.reiwa = v; renderSetup(); }

function setupGoStep2() {
  const seireki = Number(setup.reiwa) + 2018;
  setup.toolId = `${setup.muniCode}_${seireki}_${randomId(6)}`;
  setup.title = `令和${setup.reiwa}年度 ${setup.muniName} 事務事業評価`;

}

// 送信先の設定を初期化する。gasUrl は作り直し元の送信先（新規なら空）
function resetDest(gasUrl) {
  setup.importedGasUrl = gasUrl || '';
  const own = !!gasUrl && gasUrl !== DEFAULT_GAS_URL;
  setup.destMode = own ? 'own' : 'shared';
  setup.ownGasUrl = own ? gasUrl : '';
  setup.destCheck = null;
}

// 書き出し済みHTMLから DATA を取り出す
function parseExportedHtml(text) {
  const b = text.indexOf('/*DATA_BEGIN*/'), e = text.indexOf('/*DATA_END*/');
  if (b < 0 || e < 0 || e < b) return null;
  try { return JSON.parse(text.slice(b + '/*DATA_BEGIN*/'.length, e)); } catch (err) { return null; }
}

async function setupImportHtml(input) {
  const file = input.files[0];
  if (!file) return;
  const data = parseExportedHtml(await file.text());
  if (!data || !data.tool_id || !Array.isArray(data.projects)) {
    showMsg('import', 'error', 'このファイルからは事業一覧を読み取れませんでした。このツールで書き出したHTMLファイルを選んでください。');
    return;
  }
  setup.inherit = data;
  // 旧版（v1）の送信先は使えなくなったため引き継がない
  resetDest(data.v >= DATA_VERSION ? data.gas_url : '');
  setup.toolId = data.tool_id;
  setup.title = data.title || '';
  setup.prefCode = data.pref_code || '';
  setup.muniCode = data.muni_code || '';
  setup.muniName = data.muni_name || '';
  setup.reiwa = data.reiwa || '';
  setup.sourceUrl = data.source_url || '';
  setup.nextFid = 1;
  setup.files = (data.files || []).map(f => ({ fid: 'f' + (setup.nextFid++), filename: f.name, url: f.url || '', doc: null, numPages: 0 }));
  setup.nextUid = 1;
  setup.projects = data.projects.map(p => ({
    uid: setup.nextUid++,
    fid: setup.files[p.f] ? setup.files[p.f].fid : (setup.files[0] && setup.files[0].fid),
    page: p.page,
    name: p.name || null,
    sub: p.sub || ''
  }));
  setup.curFileIdx = setup.files.length ? 0 : -1;
  setup.curPage = 1;
  setup.msg = null;
  setup.step = 2;
  renderSetup();
}

function setupBackToStep1() {
  if (setup.projects.length && !confirm('入力中の事業一覧は破棄されます。最初の画面に戻りますか？')) return;
  setup.inherit = null;
  setup.files = []; setup.projects = []; setup.curFileIdx = -1; setup.curPage = 1;
  setup.msg = null;
  setup.step = 1;
  renderSetup();
}

// 画面内メッセージ・処理中表示
// ========================================================================
// 結果やエラーはポップアップではなく、操作した場所の近くに表示し、そこまで画面を移動する
function msgHtml(area) {
  const m = setup.msg;
  if (!m || m.area !== area) return '';
  return `<div class="msg msg-${m.type}" id="msg-${area}">${m.html}</div>`;
}
function scrollToId(id, block) {
  requestAnimationFrame(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: block || 'center' });
  });
}
function showMsg(area, type, html, block) {
  setup.msg = { area, type, html };
  renderSetup();
  scrollToId('msg-' + area, block);
}

// 処理中は、押したボタンを進み具合の表示に切り替え、ほかの操作ボタンも押せないようにする
function actBtn(key, label, onclick, cls) {
  const b = setup.busy;
  if (b && b.key === key) return `<button class="btn ${cls} btn-busy" disabled><span class="spinner"></span><span class="busy-text">${esc(b.text)}</span></button>`;
  return `<button class="btn ${cls}" ${b ? 'disabled' : ''} onclick="${onclick}">${label}</button>`;
}
// 進み具合はボタンと上部の帯の両方に出す
function setBusyText(t) {
  if (setup.busy) setup.busy.text = t;
  document.querySelectorAll('.busy-text').forEach(el => { el.textContent = t; });
}
const nextFrame = () => new Promise(r => setTimeout(r, 0));

// fn は処理の結果メッセージ {area, type, html, block} を返す（null なら再描画のみ）。fn の中では renderSetup しないこと
async function runBusy(key, text, fn) {
  if (setup.busy) return;
  setup.busy = { key, text };
  setup.msg = null;
  renderSetup();
  await nextFrame();
  let result;
  try { result = await fn(); }
  catch (e) { result = { area: key, type: 'error', html: 'エラーが発生しました：' + esc(e && e.message || e) }; }
  setup.busy = null;
  if (result) showMsg(result.area || key, result.type, result.html, result.block);
  else renderSetup();
}

// 各手順が済んだかどうか。まだ済んでいない最初の手順を「いまここ」とする
function stepStatus() {
  const files = setup.files;
  const done = {};
  done[1] = files.length > 0 && files.every(f => f.doc && f.url);
  done[2] = setup.projects.length > 0;
  done[3] = done[2] && setup.projects.every(p => normName(p.name)) && !analyzeDuplicates().adj.length;
  done[4] = setup.destMode === 'shared' || !!(setup.destCheck && setup.destCheck.ok && setup.destCheck.url === setup.ownGasUrl.trim());
  done[5] = !!setup.lastExportName;
  const cur = [1, 2, 3, 4, 5].find(k => !done[k]) || 0;
  return { done, cur };
}
function stepMark(st, k) { return st.done[k] ? '✅ ' : (st.cur === k ? '▶ ' : ''); }

function updateSide() {

async function drawSide() {
  const token = ++sideRenderToken;
  const f = setup.files[setup.curFileIdx];
  if (!f || !f.doc) return;
  const page = await f.doc.getPage(setup.curPage);
  if (token !== sideRenderToken) return;
  const restore = setup.sideScroll;
  setup.sideScroll = null;
  if (setup.sideTab === 'text') {
    const t = await pageTextSorted(page);
    const el = document.getElementById('side-text');
    if (token === sideRenderToken && el) el.textContent = t || '（このページから文字を取り出せませんでした。画像として作られたPDFの可能性があります）';
    return;
  }
  const canvas = document.getElementById('pdf-canvas');
  const body = document.getElementById('side-body');
  if (!canvas || !body) return;
  const unscaled = page.getViewport({ scale: 1 });
  const fit = Math.max(200, body.clientWidth - 20) / unscaled.width;
  const viewport = page.getViewport({ scale: fit * setup.zoom });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  if (restore && token === sideRenderToken) { body.scrollTop = restore.top; body.scrollLeft = restore.left; }
}

// 接続の確認：データは書き込まない。

function copyGasCode() {

// ── 番号の割り当て（書き出し時に確定。一覧ではプレビュー表示） ──────────────
// 新規：表示順に1から連番。
// 引き継ぎ：①事業名が一致する前回の事業の番号を受け継ぐ。同名が複数ある場合は、
//           同じPDFファイル・近いページ同士を優先して対応付ける。
//           ②対応する事業がない場合は、前回までに使った最大番号の続きを振る（欠番は再利用しない）。
function sortedProjects() {
  const order = {};
  setup.files.forEach((f, i) => { order[f.fid] = i; });
  return setup.projects.slice().sort((a, b) => ((order[a.fid] ?? 999) - (order[b.fid] ?? 999)) || (a.page - b.page) || (a.uid - b.uid));
}

function computeNumbers() {
  const list = sortedProjects();
  const result = new Map(); // uid -> {no, inherited}
  const inh = setup.inherit;
  if (!inh) {
    list.forEach((p, i) => result.set(p.uid, { no: i + 1, inherited: false }));
    return { list, result, nextNo: list.length + 1 };
  }
  const oldByName = {};
  inh.projects.forEach(op => {
    const k = normName(op.name);
    if (!k) return;
    (oldByName[k] = oldByName[k] || []).push(op);
  });
  const newByName = {};
  list.forEach(p => {
    const k = normName(p.name);
    if (!k) return;
    (newByName[k] = newByName[k] || []).push(p);
  });
  const fileOf = fid => setup.files.find(f => f.fid === fid);
  Object.keys(newByName).forEach(k => {
    const olds = oldByName[k];
    if (!olds) return;
    const pairs = [];
    newByName[k].forEach(np => {
      const nf = fileOf(np.fid);
      olds.forEach(op => {
        const of = (inh.files || [])[op.f] || {};
        const sameFile = nf && ((of.name && of.name === nf.filename) || (of.url && of.url === nf.url));
        // 同名の事業どうしは、同じPDF → 同じ補足 → 近いページ の順で対応付ける
        const sameSub = normName(np.sub) === normName(op.sub);
        pairs.push({ np, op, score: (sameFile ? 0 : 100000) + (sameSub ? 0 : 10000) + Math.abs(np.page - op.page) });
      });
    });
    pairs.sort((a, b) => a.score - b.score);
    const usedNew = new Set(), usedOld = new Set();
    pairs.forEach(({ np, op }) => {
      if (usedNew.has(np.uid) || usedOld.has(op.no)) return;
      usedNew.add(np.uid); usedOld.add(op.no);
      result.set(np.uid, { no: op.no, inherited: true });
    });
  });
  let next = Math.max(inh.next_no || 1, ...inh.projects.map(op => op.no + 1));
  list.forEach(p => { if (!result.has(p.uid)) result.set(p.uid, { no: next++, inherited: false }); });
  return { list, result, nextNo: next };
}

// ── 同じ名前の事業の分析 ─────────────────────────
// 同じ事業かどうかの判定キー：事業名＋補足
function dupKey(p) {
  const n = normName(p.name);
  return n ? n + ' || ' + normName(p.sub) : '';
}
// adj：一覧で隣り合う（同じPDFの連続した開始ページの）同じ事業 → 2枚目以降を拾った可能性が高い
// distant：それ以外で事業名＋補足が同じもの → 区別が必要
function analyzeDuplicates() {
  const list = sortedProjects();
  const adj = [];
  for (let i = 1; i < list.length; i++) {
    const prev = list[i - 1], cur = list[i];
    const k = dupKey(cur);
    if (k && cur.fid === prev.fid && k === dupKey(prev)) adj.push({ prev, cur });
  }
  const adjCur = new Set(adj.map(a => a.cur.uid));
  const groups = {};
  list.forEach(p => {
    if (adjCur.has(p.uid)) return;
    const k = dupKey(p);
    if (k) (groups[k] = groups[k] || []).push(p);
  });
  const distant = Object.keys(groups).filter(k => groups[k].length > 1).map(k => ({ name: groups[k][0].name, sub: groups[k][0].sub || '', items: groups[k] }));
  return { adj, distant };
}

function duplicateNameKeys() {
  const count = {};
  setup.projects.forEach(p => { const k = dupKey(p); if (k) count[k] = (count[k] || 0) + 1; });
  return new Set(Object.keys(count).filter(k => count[k] > 1));
}

const LABEL_HOW_IT_WORKS = `入力したラベルを各事業の開始ページで探し、<b>ラベルの右隣に書かれている文字</b>（右隣に何もなければ<b>真下</b>の文字）を取り出します。確認欄の[文字]タブで、ラベルと同じ行の右側（または次の行）に見えている文字が取り出されます。`;

// 左側の③：探し直し（注意）→ 手順1 事業名 → 手順2 補足（同名の区別にも使う）→ 手順3 不要ページの削除
// 補足を先に入れるのは、連続したページに並ぶ同名の別事業を、2枚目以降の候補と誤って削除しないため
function projectListHtml() {
  if (!setup.projects.length) return '<p class="note">まだ事業がありません。②で探すと、事業一覧（パソコンでは画面右下）に表示されます。</p>';
  const { list, result } = computeNumbers();
  const named = list.filter(p => normName(p.name)).length;
  const unnamed = list.filter(p => !normName(p.name));
  const lostCount = setup.inherit ? setup.inherit.projects.length - [...result.values()].filter(v => v.inherited).length : 0;
  const { adj, distant } = analyzeDuplicates();
  const dis = setup.busy ? 'disabled' : '';
  const pageLinks = ps => ps.map(p => `<a href="javascript:void(0)" onclick="setupShowProject(${p.uid}, true)">p.${p.page}</a>`).join('、');

// ── PDFファイル ───────────────────────────────────
// 複数のPDFをまとめて読み込む。すでに読み込み済みの同名ファイルは読み込まない
async function setupLoadPdfFile(input) {
  const picked = Array.from(input.files || []);
  input.value = '';
  if (!picked.length) return;
  const dupNames = picked.filter(file => setup.files.some(f => f.filename === file.name && f.doc)).map(f => f.name);
  const targets = picked.filter(file => !dupNames.includes(file.name));
  if (!targets.length) {
    showMsg('files', 'error', `選んだPDFはすべて読み込み済みです（${dupNames.map(esc).join('、')}）。`);
    return;
  }
  runBusy('files', `PDFを読み込んでいます… 0 / ${targets.length}`, async () => {
    const loaded = [], failed = [];
    for (let k = 0; k < targets.length; k++) {
      const file = targets[k];
      setBusyText(`PDFを読み込んでいます… ${k + 1} / ${targets.length}（${file.name}）`);
      await nextFrame();
      let doc;
      try { doc = await openPdf(await file.arrayBuffer()); }
      catch (e) { failed.push(file.name); continue; }
      // 引き継ぎで「再読込が必要」になっている同名ファイルがあれば、そこに割り当てる
      let idx = setup.files.findIndex(f => f.filename === file.name && !f.doc);
      if (idx >= 0) Object.assign(setup.files[idx], { doc, numPages: doc.numPages });
      else {
        setup.files.push({ fid: 'f' + (setup.nextFid++), filename: file.name, url: '', doc, numPages: doc.numPages });
        idx = setup.files.length - 1;
      }
      loaded.push(`${esc(file.name)}（${doc.numPages}ページ）`);
      if (setup.curFileIdx < 0 || !setup.files[setup.curFileIdx] || !setup.files[setup.curFileIdx].doc) { setup.curFileIdx = idx; setup.curPage = 1; }
    }
    let html = loaded.length ? `${loaded.length}件のPDFを読み込みました：${loaded.join('、')}` : 'PDFを読み込めませんでした。';
    if (dupNames.length) html += `<br>読み込み済みのため読み込まなかったもの：${dupNames.map(esc).join('、')}`;
    if (failed.length) html += `<br>PDFとして開けなかったもの：${failed.map(esc).join('、')}`;
    if (loaded.length) html += `<br>各PDFのURLを入力し（下の「URLをまとめて貼り付ける」も使えます）、並び順を▲▼で市の公表順に整えてから、②に進んでください。`;
    return { area: 'files', type: failed.length || !loaded.length ? 'info' : 'ok', html };
  });
}

function setupMoveFile(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= setup.files.length) return;
  const cur = setup.files[setup.curFileIdx];
  [setup.files[i], setup.files[j]] = [setup.files[j], setup.files[i]];
  setup.curFileIdx = setup.files.indexOf(cur);
  setup.msg = null;
  renderSetup();
}

function setupOpenFileUrl(i) {
  const u = (setup.files[i].url || '').trim();
  if (!/^https?:\/\//.test(u)) { showMsg('files', 'error', `「${esc(setup.files[i].filename)}」のURLが入力されていないか、http:// または https:// で始まっていません。`); return; }
  window.open(u, '_blank', 'noopener');
}

function urlFileName(u) {
  try { return decodeURIComponent(new URL(u).pathname.split('/').pop() || '').toLowerCase(); }
  catch (e) { return ''; }
}

function setupApplyBulkUrls() {
  const el = document.getElementById('bulk-url-input');
  setup.bulkUrlText = el ? el.value : setup.bulkUrlText;
  const urls = [...new Set((setup.bulkUrlText.match(/https?:\/\/[^\s"'<>]+/g) || []))];
  if (!urls.length) { showMsg('files', 'error', 'URLが見つかりませんでした。http:// または https:// で始まるURLを、1行に1つずつ貼り付けてください。'); return; }
  const matched = [], changed = [], unmatched = [];
  urls.forEach(u => {
    const name = urlFileName(u);
    const f = name && setup.files.find(x => x.filename.toLowerCase() === name);
    if (!f) { unmatched.push(u); return; }
    if (f.url && f.url !== u) changed.push(f.filename);
    f.url = u;
    matched.push(f.filename);
  });
  const missing = setup.files.filter(f => !f.url).map(f => f.filename);
  let html = `${matched.length}件のPDFにURLを設定しました。`;
  if (changed.length) html += `<br>入力済みのURLを置き換えたもの：${changed.map(esc).join('、')}`;
  if (unmatched.length) html += `<br>ファイル名が一致するPDFがなかったURL：<br>${unmatched.map(esc).join('<br>')}`;
  html += missing.length
    ? `<br>URLが未入力のPDF：${missing.map(esc).join('、')}（各行の欄に入力してください）`
    : '<br>すべてのPDFにURLが入りました。念のため「🔗 開いて確認」で、同じPDFが開くか確かめてください。';
  if (!unmatched.length) setup.bulkUrlText = '';
  showMsg('files', missing.length || unmatched.length ? 'info' : 'ok', html);
}

function setupRemoveFile(i) {

// ── 開始ページを探す ──────────────────────────────
async function pageTextSorted(page) {
  // 表示用：文字を見た目の上→下、左→右の順に並べ替える（PDF内部の描画順は見た目と一致しないため）。
  // 探す処理（setupScanKeyword）はページ内の全文字を結合して含むかどうかだけを見るので、並び順の影響を受けない。
  const tc = await page.getTextContent();
  const items = tc.items
    .filter(it => it.str && it.str.trim())
    .map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], h: it.height || Math.abs(it.transform[3]) || 8 }))
    .sort((a, b) => b.y - a.y);
  // 同じ行とみなす縦のずれは、事業名などの取り出し（extractAfterLabel）と同じ基準（文字の高さの6割、最低3pt）。
  // 表示と取り出しの基準を揃えないと、「同じ行の右隣」に見える文字と実際に取り出される文字が食い違う
  // （例：武蔵野市は値がラベルより3.4pt低く描かれ、固定3ptだと次の行に表示されていた）。
  const lines = [];
  for (const it of items) {
    const line = lines[lines.length - 1];
    if (line && Math.abs(line.y - it.y) <= Math.max(3, line.h * 0.6)) line.items.push(it);
    else lines.push({ y: it.y, h: it.h, items: [it] });
  }
  return lines.map(l => l.items.sort((a, b) => a.x - b.x).map(i => i.s.trim()).join('　')).join('\n');
}

// 読み込んだすべてのPDFで、探す文字を含むページを探して一覧を作る
function setupScanKeyword() {
  const kw = setup.keywordText.trim();
  if (!kw) { showMsg('scan', 'error', '探す文字を入力してください。'); return; }
  const files = setup.files.filter(f => f.doc);
  if (!files.length) { showMsg('scan', 'error', '①でPDFを読み込んでください。'); return; }
  const fids = new Set(files.map(f => f.fid));
  const existing = setup.projects.filter(p => fids.has(p.fid));
  const named = existing.filter(p => normName(p.name)).length;
  if (existing.length && !confirm(`今の事業一覧（${existing.length}件）を、今回探した結果で置き換えます。${named ? `\n入力済みの事業名（${named}件）も消えます。` : ''}\nよろしいですか？`)) return;
  const totalPages = files.reduce((n, f) => n + f.numPages, 0);
  runBusy('scan', `探しています… 0 / ${totalPages}ページ`, async () => {
    const found = new Map(); // fid -> [page...]
    let done = 0;
    for (const f of files) {
      const pages = [];
      for (let p = 1; p <= f.numPages; p++) {
        const tc = await (await f.doc.getPage(p)).getTextContent();
        if (tc.items.map(it => it.str).join('').includes(kw)) pages.push(p);
        if (++done % 10 === 0) { setBusyText(`探しています… ${done} / ${totalPages}ページ${files.length > 1 ? `（${f.filename}）` : ''}`); await nextFrame(); }
      }
      found.set(f.fid, pages);
    }
    const total = [...found.values()].reduce((n, ps) => n + ps.length, 0);
    if (!total) {
      return { area: 'scan', type: 'error', html: `「${esc(kw)}」を含むページは見つかりませんでした（一覧は変更していません）。確認欄の[文字]で表示される文字と見比べ、文字が正しいか確認してください。画像として作られたPDFでは探せません。` };
    }
    setup.projects = setup.projects.filter(p => !fids.has(p.fid));
    files.forEach(f => found.get(f.fid).forEach(page => setup.projects.push({ uid: setup.nextUid++, fid: f.fid, page, name: null })));
    setup.adjChecked = {};
    setup.listToTop = true;
    const zero = files.filter(f => !found.get(f.fid).length).map(f => f.filename);
    let html = `「${esc(kw)}」を含む<b>${total}ページ</b>を、各事業の1枚目として事業一覧（パソコンでは画面右下）に並べました。件数を確認し、下の「次にやること」に進んでください。`;
    if (files.length > 1) html += `<br>PDFごとの件数：${files.map(f => `${esc(f.filename)} ${found.get(f.fid).length}件`).join('、')}`;
    if (zero.length) html += `<br>⚠ 1件も見つからなかったPDF：${zero.map(esc).join('、')}（様式が違うか、文字が取り出せない可能性があります）`;
    return { area: 'list', type: zero.length ? 'info' : 'ok', block: 'start', html };
  });
}

function setupAddCurrentPage() {
  const f = setup.files[setup.curFileIdx];
  if (!f || setup.projects.some(p => p.fid === f.fid && p.page === setup.curPage)) return;
  const uid = setup.nextUid++;
  setup.projects.push({ uid, fid: f.fid, page: setup.curPage, name: null });
  renderSetup();
  const row = document.getElementById('row-' + uid);
  if (row) { row.classList.add('flash'); scrollRowIntoList(row); }
}
function setupDetectBookmarks() {
  const f = setup.files[setup.curFileIdx];
  runBusy('alt', 'しおりを読み取っています…', async () => {
    let outline;
    try { outline = await f.doc.getOutline(); } catch (e) { outline = null; }
    if (!outline || !outline.length) return { area: 'alt', type: 'error', html: 'このPDFにはしおり（ブックマーク）が見つかりませんでした。' };
    const drafts = [];
    for (const item of flattenOutline(outline)) {
      try {
        let dest = item.dest;
        if (typeof dest === 'string') dest = await f.doc.getDestination(dest);
        if (!dest) continue;
        const pageIndex = await f.doc.getPageIndex(dest[0]);
        drafts.push({ page: pageIndex + 1, name: item.title ? item.title.trim() : null });
      } catch (e) { /* このしおりはスキップ */ }
    }
    if (!drafts.length) return { area: 'alt', type: 'error', html: 'しおりからページ情報を取得できませんでした。' };
    let added = 0;
    for (const d of drafts) {
      if (setup.projects.some(p => p.fid === f.fid && p.page === d.page)) continue;
      setup.projects.push({ uid: setup.nextUid++, fid: f.fid, page: d.page, name: d.name || null });
      added++;
    }
    return { area: 'list', type: 'ok', block: 'start', html: `しおりから${added}件を一覧に追加しました${drafts.length - added ? `（${drafts.length - added}件は一覧にあるページのため追加していません）` : ''}。目次や章見出しのしおりが混ざっている場合は、各行の「削除」で取り除いてください。` };
  });
}
function flattenOutline(items) {
  let out = [];
  for (const it of items) {
    out.push(it);
    if (it.items && it.items.length) out = out.concat(flattenOutline(it.items));
  }
  return out;
}

// ── 事業名 ───────────────────────────────────────
// 開始ページで label を探し、描かれている位置（座標）を手がかりに値を取る。
//   ①ラベルと同じ文字の塊の中で、ラベルの後ろに文字が続いていればそれ
//   ②なければ、ラベルの右側で縦位置が重なる（許容＝文字の高さの6割、最低3pt）文字のうち、いちばん近いもの
//   ③右側に何もなければ、ラベルの真下で横位置が重なる文字のうち、いちばん近いもの
// PDF内部の描画順（見出しをまとめて先に描く様式が多い）には頼らない。
// 10自治体の評価シートで検証済み（2026-10-05）。描画順で「直後」を取る旧方式は、西宮市・北本市・湖西市・聖籠町で全滅していた。
// 見た目の行を固定幅（±3pt）で判定する方式は、値がラベルより少し低く描かれる武蔵野市で、隣の縦書き文字を拾ってしまうため不採用。
async function extractAfterLabel(doc, pageNo, label) {
  const tc = await (await doc.getPage(pageNo)).getTextContent();
  const items = tc.items
    .filter(it => typeof it.str === 'string' && it.str.trim())
    .map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0, h: it.height || Math.abs(it.transform[3]) || 8 }));
  // ラベルの探し方は優先順位付き：①塊全体がラベルと完全に一致 → ②ラベルで始まる → ③ラベルを含む。
  // 「部」「課」のような短いラベルが「内部管理」「担当部署」の中の文字に当たる誤りを防ぐため（湖西市で発生）。
  // 完全一致がない様式（「事業名：○○」のようにラベルと値が1つの塊等）にも②③で対応する。
  // 同じ優先度で複数あるときは、ページのいちばん上（同じ高さなら左）のもの。
  const byPos = (a, b) => b.y - a.y || a.x - b.x;
  const lab = items.filter(i => i.s.trim() === label).sort(byPos)[0]
    || items.filter(i => i.s.trim().startsWith(label)).sort(byPos)[0]
    || items.filter(i => i.s.includes(label)).sort(byPos)[0];
  if (!lab) return '';
  const rest = lab.s.slice(lab.s.indexOf(label) + label.length).trim();
  if (rest) return normName(rest);
  const tol = Math.max(3, lab.h * 0.6);
  const right = items
    .filter(i => i !== lab && i.x > lab.x + lab.w - 1 && Math.abs(i.y - lab.y) <= tol)
    .sort((a, b) => a.x - b.x)[0];
  if (right) return normName(right.s);
  const below = items
    .filter(i => i.y < lab.y - 1 && i.y > lab.y - lab.h * 4 && i.x < lab.x + lab.w + 5 && i.x + i.w > lab.x - 5)
    .sort((a, b) => b.y - a.y)[0];
  return below ? normName(below.s) : '';
}
function fileOfProject(p) { return setup.files.find(f => f.fid === p.fid); }

function setupExtractNames() {
  const label = setup.labelText.trim();
  if (!label) { showMsg('list', 'error', 'ラベルを入力してください（一覧の下の「次にやること」）。', 'start'); return; }
  const named = setup.projects.filter(p => normName(p.name)).length;
  if (named && !confirm(`入力済みの事業名（${named}件）は、取り出した名前で上書きされます。よろしいですか？`)) return;
  const targets = sortedProjects();
  runBusy('names', `事業名を取り出しています… 0 / ${targets.length}件`, async () => {
    let updated = 0, noDoc = 0;
    const failed = [];
    for (let i = 0; i < targets.length; i++) {
      const p = targets[i];
      const f = fileOfProject(p);
      if (!f || !f.doc) { noDoc++; continue; }
      const v = await extractAfterLabel(f.doc, p.page, label);
      if (v) { p.name = v; updated++; } else failed.push(p.page);
      if (i % 10 === 9) { setBusyText(`事業名を取り出しています… ${i + 1} / ${targets.length}件`); await nextFrame(); }
    }
    setup.adjChecked = {};
    setup.listToTop = true;
    const { adj, distant } = analyzeDuplicates();
    // 結果は一覧の上に表示し、一覧を上から確認できるようにする
    let html = `${targets.length}件中<b>${updated}件</b>の事業名を取り出しました。事業一覧（パソコンでは画面右下）を確認してください。`;
    if (failed.length) html += `<br>次のページでは「${esc(label)}」が見つからず、取り出せませんでした（事業一覧で直接入力してください）：p.${failed.slice(0, 20).join('、p.')}${failed.length > 20 ? ` ほか${failed.length - 20}件` : ''}`;
    if (noDoc) html += `<br>PDFが読み込まれていないため、${noDoc}件は対象外でした（①で再読込してください）。`;
    if (adj.length || distant.length) html += `<br>同じ名前の事業があります。<a href="javascript:void(0)" onclick="scrollToId('dups-anchor', 'start')">手順2・3へ ↓</a>`;
    return { area: 'list', type: (failed.length || noDoc || adj.length || distant.length) ? 'info' : 'ok', block: 'start', html };
  });
}

function setupDeleteAdjChecked() {
  const { adj } = analyzeDuplicates();
  const remove = new Set(adj.filter(a => setup.adjChecked[a.cur.uid] !== false).map(a => a.cur.uid));
  if (!remove.size) { showMsg('adj', 'error', '削除する事業にチェックを付けてください。'); return; }
  setup.projects = setup.projects.filter(p => !remove.has(p.uid));
  setup.adjChecked = {};
  const left = analyzeDuplicates();
  showMsg('adj', 'ok', `${remove.size}件を一覧から削除しました（現在${setup.projects.length}件）。${left.adj.length ? `連続したページの同名事業がまだ${left.adj.length}件あります（チェックを外したもの等）。` : ''}`);
}

// 全事業の補足を、指定したラベル（複数可）の値で入れ直す
function setupExtractSub() {
  const labels = setup.distLabelText.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
  if (!labels.length) { showMsg('dist', 'error', '補足に入れる項目のラベルを入力してください（例：担当部課）。'); return; }
  const had = setup.projects.filter(p => normName(p.sub)).length;
  if (had && !confirm(`入力済みの補足（${had}件）は、取り出した内容で置き換わります。よろしいですか？`)) return;
  const targets = sortedProjects();
  runBusy('dist', `補足を取り出しています… 0 / ${targets.length}件`, async () => {
    let filled = 0, noDoc = 0;
    const failed = [];
    for (let i = 0; i < targets.length; i++) {
      const p = targets[i];
      const f = fileOfProject(p);
      if (!f || !f.doc) { noDoc++; continue; }
      const vals = [];
      for (const label of labels) {
        const v = await extractAfterLabel(f.doc, p.page, label);
        if (v) vals.push(v);
      }
      p.sub = vals.join('・');
      if (vals.length) filled++; else failed.push(p.page);
      if (i % 10 === 9) { setBusyText(`補足を取り出しています… ${i + 1} / ${targets.length}件`); await nextFrame(); }
    }
    const remain = analyzeDuplicates().distant.length;
    let html = `${targets.length}件中<b>${filled}件</b>の補足を入れました（${labels.map(esc).join('・')}）。`;
    if (failed.length) html += `<br>次のページでは取り出せませんでした（事業一覧で直接入力できます）：p.${failed.slice(0, 20).join('、p.')}${failed.length > 20 ? ` ほか${failed.length - 20}件` : ''}`;
    if (noDoc) html += `<br>PDFが読み込まれていないため、${noDoc}件は対象外でした（①で再読込してください）。`;
    html += remain ? `<br>事業名も補足も同じ事業が${remain}組残っています。` : '';
    return { area: 'dist', type: (remain || failed.length || noDoc) ? 'info' : 'ok', html };
  });
}
function setupClearSub() {
  if (!confirm('すべての事業の補足を消しますか？')) return;
  setup.projects.forEach(p => { p.sub = ''; });
  showMsg('dist', 'info', '補足をすべて消しました。');
}

// ── 一覧の編集 ───────────────────────────────────
function findProject(uid) { return setup.projects.find(x => x.uid === uid); }
function setupUpdateProjectName(uid, val) {
  const p = findProject(uid);
  if (!p) return;
  p.name = val.trim() || null;
  // ここで再描画すると、次の入力欄へ移ったフォーカスが外れるため行わない（重複表示などは次の操作で更新される）
}
function setupUpdateProjectSub(uid, val) {
  const p = findProject(uid);
  if (p) p.sub = val.trim();
}

function setupDeleteProject(uid) {
  const p = findProject(uid);
  if (!p || !confirm(`p.${p.page}「${p.name || '(事業名未設定)'}」を一覧から削除しますか？`)) return;
  setup.projects = setup.projects.filter(x => x.uid !== uid);
  renderSetup();
}
function setupClearProjects() {
  if (!confirm(`一覧の${setup.projects.length}件をすべて削除しますか？${setup.inherit ? '\n（引き継ぎは維持されます。作り直した事業は、事業名が前回と同じなら前回の番号が付きます）' : ''}`)) return;
  setup.projects = [];
  showMsg('list', 'info', '一覧をすべて削除しました。②で探し直してください。', 'start');
}
// 行（または同名事業の案内のリンク）を押したとき：確認欄にその事業の評価シートを表示する。
// fromLeft は左側の作業欄から押した場合。狭い画面では確認欄が上にあるので、そこへ移動する
function setupShowProject(uid, fromLeft) {
  const p = findProject(uid);
  if (!p) return;
  const idx = setup.files.findIndex(f => f.fid === p.fid);
  if (idx < 0 || !setup.files[idx].doc) {
    showMsg('list', 'error', 'この事業のPDFは読み込まれていません。①で再読込してください。', 'start');
    return;
  }
  if (idx !== setup.curFileIdx) {
    setup.curFileIdx = idx;
    setup.curPage = p.page;
    renderSetup();
  } else {
    setup.curPage = p.page;
    updateSide();
  }
  if (fromLeft) {
    highlightCurrentRows(true);
    if (isNarrow()) scrollToId('side', 'start');
  }
}
// ── 書き出し ─────────────────────────────────────
function setupExport() {
  if (!setup.projects.length) return;
  const { adj, distant } = analyzeDuplicates();
  const unnamed = setup.projects.filter(p => !normName(p.name)).length;
  const notes = [];
  if (adj.length) notes.push(`・連続したページに同じ名前の事業が${adj.length}件あります（2ページ目以降を拾っている可能性）`);
  if (distant.length) notes.push(`・事業名も補足も同じ事業が${distant.length}組あります`);
  if (unnamed) notes.push(`・事業名が空欄の事業が${unnamed}件あります（「事業 No.○」と表示され、作り直しの際に前回の投票を引き継げません）`);
  if (notes.length && !confirm(`次の点が残っていますが、このまま書き出しますか？\n${notes.join('\n')}`)) return;

  if (setup.destMode === 'own') {
    const fmt = gasUrlFormatError(setup.ownGasUrl.trim());
    if (fmt) { showMsg('dest', 'error', '送信先：' + esc(fmt)); return; }
    const ok = setup.destCheck && setup.destCheck.ok && setup.destCheck.url === setup.ownGasUrl.trim();
    if (!ok && !confirm('自分のスプレッドシートへの接続確認がまだ済んでいません（④）。このまま書き出しますか？')) return;
  }

  runBusy('export', '書き出しています…', async () => {
    const { list, result, nextNo } = computeNumbers();
    const fileIndex = {};
    setup.files.forEach((f, i) => { fileIndex[f.fid] = i; });
    const seireki = Number(setup.reiwa) + 2018;
    const data = {
      v: DATA_VERSION,
      tool_id: setup.toolId,
      title: setup.title,
      pref_code: setup.prefCode,
      muni_code: setup.muniCode,
      muni_name: setup.muniName,
      reiwa: setup.reiwa,
      source_url: setup.sourceUrl || '',
      gas_url: currentGasUrl(),
      generated_at: new Date().toISOString(),
      files: setup.files.map(f => ({ name: f.filename, url: f.url || '' })),
      projects: list.map(p => {
        const o = { no: result.get(p.uid).no, name: normName(p.name) || null, f: fileIndex[p.fid], page: p.page };
        const sub = normName(p.sub);
        if (sub) o.sub = sub;
        return o;
      }),
      next_no: nextNo
    };

    // 事業名に「<」（閉じタグ等）が含まれていても、書き出したHTMLのscript要素が途中で終わらないようにエスケープする
    const json = JSON.stringify(data).replace(/</g, String.fromCharCode(92) + 'u003c');
    // 注意：このscript要素の中に閉じタグの文字列をそのまま書くと、HTML上でここで要素が終わってしまうため分割して書く
    const CLOSE_SCRIPT = '<' + '/script>';
    const tpl = document.getElementById('eval-template').textContent;
    const html = tpl
      .replace('__TITLE__', () => esc(setup.title))
      .replace('/*DATA_BEGIN*/null/*DATA_END*/', () => '/*DATA_BEGIN*/' + json + '/*DATA_END*/')
      .split('<' + String.fromCharCode(92) + '/script>').join(CLOSE_SCRIPT);

    const filename = `jimujigyou_${setup.muniCode}_${seireki}.html`;
    downloadHtml(filename, html);

    // 以後この画面で書き出し直しても番号がずれないよう、今回の書き出し内容を引き継ぎ元にする
    setup.inherit = data;
    setup.importedGasUrl = data.gas_url;
    setup.lastExportName = filename;
    setup.lastExport = { filename, html, title: data.title, count: data.projects.length, own: setup.destMode === 'own', toolId: data.tool_id };
    // 書き出したら完了画面に切り替える
    setup.step = 3;
    setup.msg = null;
    return null;
  });
}
